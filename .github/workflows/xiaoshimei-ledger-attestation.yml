name: Xiaoshimei ledger attestation

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      vercel_environment:
        description: Exact Vercel environment to attest
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      candidate_commit:
        description: Exact 40-character deployment commit
        required: true
        type: string
      app_scope:
        description: Exact Xiaoshimei app scope from the target runtime
        required: true
        type: string
      allow_candidate_rotation:
        description: Permit this manual run to replace only the signed candidate commit binding
        required: true
        default: false
        type: boolean
      legacy_runtime_compat:
        description: Mirror this exact Production rollback receipt to the legacy key read by the already-built rollback binary
        required: true
        default: false
        type: boolean
      zero_provider_recovery:
        description: Recover the one D43 false UNKNOWN after exact Redis preimage verification
        required: true
        default: false
        type: boolean
      recovery_run_id:
        description: Exact D43 image run id; required only for recovery
        required: false
        type: string
      recovery_checkpoint_sha256:
        description: Exact D43 checkpoint SHA-256; required only for recovery
        required: false
        type: string
      recovery_logical_step_id:
        description: Exact D43 logical step id; required only for recovery
        required: false
        type: string
      recovery_attempt_nonce:
        description: Exact canonical attempt nonce; required only for recovery
        required: false
        type: string
      recovery_evidence_sha256:
        description: Exact frozen D43 Reality evidence SHA-256; required only for recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xiaoshimei-ledger-attestation
  cancel-in-progress: false

jobs:
  attest:
    name: Verify and renew the signed image-ledger receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTASH_DEVELOPER_EMAIL: ${{ secrets.UPSTASH_DEVELOPER_EMAIL }}
      UPSTASH_DEVELOPER_API_KEY: ${{ secrets.UPSTASH_DEVELOPER_API_KEY }}
      XIAOSHIMEI_LEDGER_ATTESTATION_PRIVATE_KEY: ${{ secrets.XIAOSHIMEI_LEDGER_ATTESTATION_PRIVATE_KEY }}
      UPSTASH_DATABASE_ID: ${{ secrets.UPSTASH_DATABASE_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      XIAOSHIMEI_VERCEL_PROJECT_ID: ${{ vars.XIAOSHIMEI_VERCEL_PROJECT_ID }}
      XIAOSHIMEI_WORST_CASE_RUN_BYTES: ${{ vars.XIAOSHIMEI_WORST_CASE_RUN_BYTES }}
      VERCEL_ENV: ${{ github.event_name == 'schedule' && 'production' || inputs.vercel_environment }}
      XIAOSHIMEI_CANDIDATE_COMMIT: ${{ github.event_name == 'schedule' && vars.XIAOSHIMEI_PRODUCTION_COMMIT || inputs.candidate_commit }}
      XIAOSHIMEI_ROLLBACK_COMMIT: ${{ github.event_name == 'schedule' && vars.XIAOSHIMEI_ROLLBACK_COMMIT || '' }}
      XIAOSHIMEI_APP_SCOPE: ${{ github.event_name == 'schedule' && vars.XIAOSHIMEI_PRODUCTION_APP_SCOPE || inputs.app_scope }}
      XIAOSHIMEI_ATTESTATION_ONLY_IF_DUE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      XIAOSHIMEI_ATTESTATION_ALLOW_CANDIDATE_ROTATION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_candidate_rotation && 'true' || 'false' }}
      XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_runtime_compat && 'true' || 'false' }}
      XIAOSHIMEI_ATTESTATION_RENEW_LEAD_MS: "86400000"
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.zero_provider_recovery && 'true' || 'false' }}
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_CHECKPOINT_SHA256: ${{ inputs.recovery_checkpoint_sha256 }}
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_LOGICAL_STEP_ID: ${{ inputs.recovery_logical_step_id }}
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_ATTEMPT_NONCE: ${{ inputs.recovery_attempt_nonce }}
      XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_EVIDENCE_SHA256: ${{ inputs.recovery_evidence_sha256 }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the explicit binding inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_ENV" = "preview" || test "$VERCEL_ENV" = "production"
          test "${#XIAOSHIMEI_CANDIDATE_COMMIT}" -eq 40
          case "$XIAOSHIMEI_CANDIDATE_COMMIT" in (*[!0-9a-fA-F]*) exit 1;; esac
          if test "$GITHUB_EVENT_NAME" = "schedule"; then
            test "${#XIAOSHIMEI_ROLLBACK_COMMIT}" -eq 40
            case "$XIAOSHIMEI_ROLLBACK_COMMIT" in (*[!0-9a-fA-F]*) exit 1;; esac
            test "$XIAOSHIMEI_ROLLBACK_COMMIT" != "$XIAOSHIMEI_CANDIDATE_COMMIT"
          fi
          test -n "$XIAOSHIMEI_APP_SCOPE"
          test "$XIAOSHIMEI_ATTESTATION_ALLOW_CANDIDATE_ROTATION" = "true" || test "$XIAOSHIMEI_ATTESTATION_ALLOW_CANDIDATE_ROTATION" = "false"
          test "$XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT" = "true" || test "$XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT" = "false"
          test "$XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE" = "true" || test "$XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE" = "false"
          if test "$XIAOSHIMEI_ATTESTATION_ALLOW_CANDIDATE_ROTATION" = "true"; then test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; fi
          if test "$XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT" = "true"; then test "$GITHUB_EVENT_NAME" = "workflow_dispatch" && test "$VERCEL_ENV" = "production"; fi
          if test "$XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE" = "true"; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$VERCEL_ENV" = "production"
            test "$XIAOSHIMEI_ATTESTATION_ALLOW_CANDIDATE_ROTATION" = "false"
            test "$XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT" = "false"
            test -n "$XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_RUN_ID"
            test "${#XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_CHECKPOINT_SHA256}" -eq 64
            test -n "$XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_LOGICAL_STEP_ID"
            test "${#XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_ATTEMPT_NONCE}" -eq 64
            test "${#XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_EVIDENCE_SHA256}" -eq 64
          fi

      - name: Verify or renew the signed receipt
        if: env.XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/attest-upstash-image-ledger.mjs
          if test "$GITHUB_EVENT_NAME" = "schedule"; then
            XIAOSHIMEI_CANDIDATE_COMMIT="$XIAOSHIMEI_ROLLBACK_COMMIT" XIAOSHIMEI_ATTESTATION_LEGACY_RUNTIME_COMPAT=true node scripts/attest-upstash-image-ledger.mjs
          fi

      - name: Recover the exact D43 zero-Provider false UNKNOWN
        if: env.XIAOSHIMEI_ZERO_PROVIDER_RECOVERY_MODE == 'true'
        run: node scripts/attest-upstash-image-ledger.mjs
