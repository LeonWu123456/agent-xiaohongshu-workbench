name: Build macOS Apple Silicon qualification package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build unsigned macOS ARM64 package
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workflow tests
        run: npm test

      - name: Package Apple Silicon macOS artifacts
        run: npm run package:mac:arm64

      - name: Verify architecture and packaged runtime
        shell: bash
        run: |
          set -euo pipefail

          zip_file="$(find release -maxdepth 1 -type f -name '*-arm64.zip' -print -quit)"
          dmg_file="$(find release -maxdepth 1 -type f -name '*-arm64.dmg' -print -quit)"
          test -n "$zip_file"
          test -n "$dmg_file"

          verification_dir="$(mktemp -d)"
          ditto -x -k "$zip_file" "$verification_dir"
          app_path="$(find "$verification_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          app_binary="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$app_binary"
          file "$app_binary" | tee macos-binary-architecture.txt
          file "$app_binary" | grep -q 'arm64'

          packaged_app_root="$app_path/Contents/Resources/app"
          test -d "$packaged_app_root"
          test ! -e "$packaged_app_root/.data"
          test ! -e "$packaged_app_root/output"
          test ! -e "$packaged_app_root/public/generated"
          test ! -e "$packaged_app_root/public/brand/avatars"
          test ! -e "$packaged_app_root/public/brand/actions"

          "$app_binary" --smoke-test 2>&1 | tee macos-packaged-smoke-test.txt
          grep -q 'AGENT_XHS_DESKTOP_SMOKE_OK' macos-packaged-smoke-test.txt

      - name: Upload unsigned qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-unsigned-qualification
          path: |
            release/*.dmg
            release/*.zip
            macos-binary-architecture.txt
            macos-packaged-smoke-test.txt
          if-no-files-found: error
          retention-days: 14
